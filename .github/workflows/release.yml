name: Release

on:
  workflow_call:
    inputs:
      development-checked:
        description: The caller has passed development checks for this exact commit
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main version after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release intent and changelog
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 scripts/release.py plan --event "$EVENT" --before "$BEFORE" "${args[@]}"

  checks:
    needs: plan
    # CI callers already checked this exact commit. A standalone manual run
    # must run its own checks, including dry runs and non-main branches.
    if: ${{ !inputs.development-checked }}
    uses: ./.github/workflows/development-checks.yml

  build:
    needs: [plan, checks]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (github.event_name != 'push' || needs.plan.outputs.publish == 'true')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain and library notices
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rust-docs
      - name: Cache native distribution dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/dist
            target/debug
          key: cargo-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dist-workspace.toml') }}
      - name: Run native Rust regression tests
        if: github.event_name != 'pull_request'
        run: cargo test --locked --all-features
      - name: Install the pinned packaging tool
        run: bash scripts/install_dist.sh
      - name: Test release guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build archive and test the unpacked CLI and MCP server
        run: bash scripts/build_release.sh
      - name: Record publication intent for the tested commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # The build helper always plans a dry run. Only this trusted event
          # determines whether its already-tested artifacts may be published.
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 scripts/release.py plan --event "$EVENT" --before "$BEFORE" "${args[@]}"
      - name: Retain the tested release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-release
          path: target/release-plan/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, checks, build]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.publish == 'true' && needs.build.result == 'success' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-release
          path: target/tested-release
      - name: Verify the transferred archive checksum
        working-directory: target/tested-release/artifacts
        run: sha256sum -c SHA256SUMS
      - name: Upload all assets to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish target/tested-release
