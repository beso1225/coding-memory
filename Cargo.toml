[package]
name = "coding-memory"
version = "0.1.0"
edition = "2024"
description = "Long-term memory for coding agents"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["process", "io-util", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
